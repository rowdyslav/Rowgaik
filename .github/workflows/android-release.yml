name: Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".env.example"
      - ".vscode/**"
      - ".idea/**"
      - ".githooks/**"
      - ".husky/**"
      - "hooks/**"
      - "scripts/local/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".env.example"
      - ".vscode/**"
      - ".idea/**"
      - ".githooks/**"
      - ".husky/**"
      - "hooks/**"
      - "scripts/local/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Clean Flet build
        run: flet clean

      - name: Build APK
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          flet build apk \
            --yes \
            --no-rich-output \
            --build-version "$version" \
            --build-number "$GITHUB_RUN_NUMBER"

          sed -i \
            -e 's/Theme.Black.NoTitleBar/Theme.Light.NoTitleBar/g' \
            -e 's/#222222/#ffffff/g' \
            build/flutter/android/app/src/main/res/values-night/styles.xml \
            build/flutter/android/app/src/main/res/values-night-v31/styles.xml

          (
            cd build/flutter
            export SERIOUS_PYTHON_SITE_PACKAGES="$GITHUB_WORKSPACE/build/site-packages"
            flutter build apk \
              --release \
              --build-name "$version" \
              --build-number "$GITHUB_RUN_NUMBER"
          )

          cp build/flutter/build/app/outputs/flutter-apk/app-release.apk build/apk/rowgaik.apk

          apk_path="$(find build/apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "APK was not produced"
            exit 1
          fi

          mkdir -p release
          cp "$apk_path" "release/Rowgaik-${GITHUB_REF_NAME}.apk"
          cp "$apk_path" "release/Rowgaik-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rowgaik-${{ github.ref_name }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.apk --generate-notes --title "${GITHUB_REF_NAME#v}"