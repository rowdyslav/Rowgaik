name: Android CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "pyproject.toml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Determine version and tag
        id: verinfo
        run: |
          base_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          base_tag="v${base_version}"

          if git show-ref --tags --verify --quiet "refs/tags/${base_tag}"; then
            n=1
            while git show-ref --tags --verify --quiet "refs/tags/${base_tag}-fix.${n}"; do
              n=$((n + 1))
            done
            tag="${base_tag}-fix.${n}"
            is_fix=true
          else
            tag="${base_tag}"
            is_fix=false
          fi

          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "is_fix=${is_fix}" >> "$GITHUB_OUTPUT"

      - name: Clean Flet build
        run: flet clean

      - name: Build APK
        env:
          BUILD_VERSION: ${{ steps.verinfo.outputs.base_version }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          flet build apk \
            --yes \
            --no-rich-output \
            --build-version "$BUILD_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER"

          sed -i \
            -e 's/Theme.Black.NoTitleBar/Theme.Light.NoTitleBar/g' \
            -e 's/#222222/#ffffff/g' \
            build/flutter/android/app/src/main/res/values-night/styles.xml \
            build/flutter/android/app/src/main/res/values-night-v31/styles.xml

          (
            cd build/flutter
            export SERIOUS_PYTHON_SITE_PACKAGES="$GITHUB_WORKSPACE/build/site-packages"
            flutter build apk \
              --release \
              --build-name "$BUILD_VERSION" \
              --build-number "$GITHUB_RUN_NUMBER"
          )

          cp build/flutter/build/app/outputs/flutter-apk/app-release.apk build/apk/rowgaik.apk

          apk_path="$(find build/apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "APK was not produced"
            exit 1
          fi

          mkdir -p release
          cp "$apk_path" "release/Rowgaik-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rowgaik-${{ steps.verinfo.outputs.tag }}
          path: release/*.apk
          if-no-files-found: error

      - name: Create and push tag
        env:
          TAG: ${{ steps.verinfo.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verinfo.outputs.tag }}
          IS_FIX: ${{ steps.verinfo.outputs.is_fix }}
        run: |
          if [[ "$IS_FIX" == "true" ]]; then
            title="${TAG} (fix)"
          else
            title="${TAG#v}"
          fi

          gh release create "$TAG" release/Rowgaik-latest.apk \
            --generate-notes \
            --title "$title"
