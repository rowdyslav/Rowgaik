[project]
name = "rowgaik"
version = "2.0.0"
description = "Webview flet app for Miigaik"
readme = "README.md"
authors = [
    { name = "rowdyslav", email = "rowdyslav@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    # flet 1.1.x pins Flutter 3.47.9 (Dart 3.12.2), but its app template requires
    # material_ui ^1.6.0 which needs Dart ^3.13.0 — builds are broken upstream.
    "flet==1.0.5",
    "flet-webview==1.0.5",
]

[tool.flet]
product = "Rowgaik"
org = "ru.miigaik"
bundle_id = "ru.miigaik.rowgaik"
android_adaptive_icon_background = "#1B2430"
splash_color = "#1B2430"
splash_dark_color = "#FFFFFF"
