[project]
name = "rowgaik"
version = "2.1.0"
description = "Webview flet app for Miigaik"
readme = "README.md"
authors = [
    { name = "rowdyslav", email = "rowdyslav@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flet==1.1.2",
    "flet-webview==1.1.2",
]

[tool.flet]
product = "Rowgaik"
org = "ru.miigaik"
bundle_id = "ru.miigaik.rowgaik"
android_adaptive_icon_background = "#1B2430"
splash_color = "#1B2430"
splash_dark_color = "#FFFFFF"
